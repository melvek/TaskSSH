# 全局参数
global_vars:
  port: 22
  username: web
  password: 2dO7ObeRBjqyuKkMpV6Xkg==
  command: ${service_path}deploy.sh -r

# 服务器清单
servers:
  web_master:
    hosts:
      web_server: 172.21.1.74
    vars:
      service_path: /app/web/
      package_path: bin/taskssh-1.2.1.jar

# 任务定义
tasks:
  deploy:
    steps:
      - name: "上传文件"
        action: push
        delay: 5
        with:
          file: "${package_path}"
          dest: "${service_path}"
          force: false
      - name: "启动服务"
        action: command
        with:
          command: "cd ${service_path}deploy.sh -r"
