tasks:
  # 自定义的任务名称，对应执行时的任务名称
  health:
    # 任务描述信息
    description: "健康检查"
    steps:
      - name: "健康检查"
        action: command
        when: "{{env}} == prod && {{exec_id}}==EX2D653B"
        delay: 5
        interval: 2
        timeout: 30
        with:
          command: "systemctl restart {{app_name}}"